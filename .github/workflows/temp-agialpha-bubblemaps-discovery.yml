name: TEMP AGIALPHA Bubblemaps discovery
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-agialpha-bubblemaps-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Discover public Bubblemaps data endpoints
        shell: bash
        run: |
          mkdir -p temp_bubblemaps_discovery
          cat > /tmp/discover.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const mint='tWKHzXd5PRmxTF5cMfJkm2Ua3TcjwNNoSRUqx6Apump';
          const urls=[
            `https://v2.bubblemaps.io/map?address=${mint}&chain=solana&partnerId=regular`,
            `https://app.bubblemaps.io/sol/token/${mint}`
          ];
          const out={generated:new Date().toISOString(),mint,pages:[],direct:{}};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1920,height:1080},userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'});
          for(let pi=0;pi<urls.length;pi++){
            const page=await context.newPage();
            const p={requested:urls[pi],requests:[],responses:[],console:[],errors:[]};
            page.on('console',m=>p.console.push({type:m.type(),text:m.text()}));
            page.on('pageerror',e=>p.errors.push(String(e)));
            page.on('request',req=>{
              const u=req.url();
              if(/bubble|map|cluster|holder|node|graph|token|snapshot|history|travel|time|api/i.test(u)) p.requests.push({url:u,method:req.method(),resourceType:req.resourceType(),postData:req.postData()});
            });
            page.on('response',async res=>{
              const u=res.url(); const h=await res.allHeaders().catch(()=>({})); const ct=h['content-type']||'';
              if(/bubble|map|cluster|holder|node|graph|token|snapshot|history|travel|time|api/i.test(u) || /json|javascript/i.test(ct)){
                let body=''; try{body=await res.text();}catch{}
                if(body.length>3000000) body=body.slice(0,3000000);
                p.responses.push({url:u,status:res.status(),contentType:ct,body});
              }
            });
            try{
              await page.goto(urls[pi],{waitUntil:'domcontentloaded',timeout:120000});
              await page.waitForTimeout(60000);
              p.finalUrl=page.url(); p.title=await page.title();
              p.bodyText=(await page.locator('body').innerText()).slice(0,1000000);
              p.html=(await page.content()).slice(0,5000000);
              p.cookies=await context.cookies();
              p.localStorage=await page.evaluate(()=>Object.fromEntries(Object.keys(localStorage).map(k=>[k,localStorage.getItem(k)]))).catch(()=>({}));
              p.sessionStorage=await page.evaluate(()=>Object.fromEntries(Object.keys(sessionStorage).map(k=>[k,sessionStorage.getItem(k)]))).catch(()=>({}));
              p.buttons=await page.locator('button').evaluateAll(els=>els.map((e,i)=>({i,text:(e.innerText||'').trim(),aria:e.getAttribute('aria-label'),title:e.getAttribute('title')})).filter(x=>x.text||x.aria||x.title)).catch(()=>[]);
              p.inputs=await page.locator('input').evaluateAll(els=>els.map((e,i)=>({i,placeholder:e.getAttribute('placeholder'),type:e.getAttribute('type'),aria:e.getAttribute('aria-label'),value:e.value}))).catch(()=>[]);
              p.links=await page.locator('a').evaluateAll(els=>els.map((e,i)=>({i,text:(e.innerText||'').trim(),href:e.href})).filter(x=>x.href)).catch(()=>[]);
              await page.screenshot({path:`temp_bubblemaps_discovery/page-${pi}.png`,fullPage:true});
              // Try opening likely historical controls without entering email.
              const candidates=page.getByRole('button').filter({hasText:/time|travel|history|date|calendar/i});
              const c=await candidates.count().catch(()=>0);
              p.historyCandidateCount=c;
              for(let i=0;i<Math.min(c,10);i++){
                try{await candidates.nth(i).click({timeout:5000});await page.waitForTimeout(2500);p.afterHistoryClick=(await page.locator('body').innerText()).slice(0,500000);await page.screenshot({path:`temp_bubblemaps_discovery/page-${pi}-history.png`,fullPage:true});break;}catch(e){p.errors.push('history click '+String(e));}
              }
            }catch(e){p.errors.push(String(e));}
            out.pages.push(p);
            await page.close();
          }
          const endpoints=[
            `https://api-legacy.bubblemaps.io/map-availability?chain=sol&token=${mint}`,
            `https://api-legacy.bubblemaps.io/map-availability?chain=solana&token=${mint}`,
            `https://api-legacy.bubblemaps.io/map-data?chain=sol&token=${mint}`,
            `https://api-legacy.bubblemaps.io/map-data?chain=solana&token=${mint}`,
            `https://api-legacy.bubblemaps.io/map-metadata?chain=sol&token=${mint}`,
            `https://api-legacy.bubblemaps.io/map-metadata?chain=solana&token=${mint}`,
            `https://api.bubblemaps.io/maps/solana/${mint}`
          ];
          for(const u of endpoints){
            try{const r=await context.request.get(u,{timeout:60000});out.direct[u]={status:r.status(),headers:await r.allHeaders(),body:(await r.text()).slice(0,10000000)};}catch(e){out.direct[u]={error:String(e)};}
          }
          fs.writeFileSync('temp_bubblemaps_discovery/discovery.json',JSON.stringify(out,null,2));
          await browser.close();
          JS
          node /tmp/discover.mjs
          python - <<'PY'
          import json
          p='temp_bubblemaps_discovery/discovery.json'
          d=json.load(open(p))
          lines=['# Bubblemaps discovery digest','',f"Generated: {d['generated']}",'']
          for i,p in enumerate(d['pages']):
              lines += [f'## Page {i}',f"- Requested: {p.get('requested')}",f"- Final: {p.get('finalUrl')}",f"- Title: {p.get('title')}",f"- Requests: {len(p.get('requests',[]))}",f"- Responses: {len(p.get('responses',[]))}",f"- Buttons: {p.get('buttons')}",f"- Inputs: {p.get('inputs')}",f"- Body excerpt: `{p.get('bodyText','')[:3000]}`",'']
              lines += ['### Response URLs']+[f"- {r.get('status')} {r.get('contentType')} {r.get('url')} body={len(r.get('body',''))}" for r in p.get('responses',[])]+['']
          lines += ['## Direct endpoints']+[f"- {u}: {z.get('status')} {z.get('error','')} body={len(z.get('body',''))}" for u,z in d['direct'].items()]
          open('temp_bubblemaps_discovery/digest.md','w').write('\n'.join(lines))
          PY
      - name: Commit discovery evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp_bubblemaps_discovery
          git commit -m 'TEMP add AGIALPHA Bubblemaps discovery evidence'
          git push
