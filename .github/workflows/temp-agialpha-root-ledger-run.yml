name: TEMP isolated AGIALPHA root ledger
on:
  pull_request:
    branches: [temp-agialpha-root-base-20260805]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Trace all direct outflows from the 16 launch roots
        shell: bash
        run: |
          mkdir -p root-output
          cat > /tmp/root_trace.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/root_trace.py.gz.b64 | gzip -d > /tmp/root_trace.py
          python /tmp/root_trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: agialpha-root-ledger
          path: root-output
          if-no-files-found: error
          retention-days: 1
