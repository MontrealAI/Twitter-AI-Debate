name: TEMP AGIALPHA complete provenance trace
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Trace all descendants of the 16 non-creator launch wallets
        shell: bash
        run: |
          mkdir -p complete-output
          cat > /tmp/complete_trace.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/complete_trace.py.gz.b64 | gzip -d > /tmp/complete_trace.py
          python /tmp/complete_trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: agialpha-complete-provenance-trace
          path: complete-output
          if-no-files-found: error
          retention-days: 1
