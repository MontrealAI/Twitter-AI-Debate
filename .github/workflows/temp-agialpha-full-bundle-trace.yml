name: TEMP AGIALPHA full bundle trace
on:
  push:
    branches: [temp-agialpha-full-bundle-trace-20260805]
    paths:
      - '.github/workflows/temp-agialpha-full-bundle-trace.yml'
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Trace the full non-creator launch bundle
        shell: bash
        run: |
          mkdir -p output
          cat > /tmp/full_bundle_trace.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/full_bundle_trace.py.gz.b64 | gunzip > /tmp/full_bundle_trace.py
          python /tmp/full_bundle_trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: agialpha-full-noncreator-bundle-trace
          path: output
          if-no-files-found: error
          retention-days: 1
