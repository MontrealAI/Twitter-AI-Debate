name: TEMP AGIALPHA full bundle PR run
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Trace the complete non-creator launch bundle
        shell: bash
        run: |
          mkdir -p output
          base64 -d TEMP_FULL_BUNDLE_TRACE.py.gz.b64 | gunzip > /tmp/full_bundle_trace.py
          python /tmp/full_bundle_trace.py
      - uses: actions/upload-artifact@v4
        with:
          name: agialpha-full-noncreator-bundle-trace
          path: output
          if-no-files-found: error
          retention-days: 1
